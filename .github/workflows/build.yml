name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot 4.3 & Export Templates
        run: |
          echo "Downloading Godot 4.3 headless..."
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          sudo mv /tmp/godot_bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm -f /tmp/godot.zip

          echo "Downloading Godot 4.3 export templates..."
          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf /tmp/templates.tpz /tmp/godot_templates

      - name: Setup Keystore & Configuration
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '' >> ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"$ANDROID_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\"" >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres

          # Also configure export_presets.cfg with the keystore path
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/.android/debug.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|g" export_presets.cfg
          sed -i "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|g" export_presets.cfg

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --editor --quit || true
          godot --headless --verbose --export-debug "Android" build/BalloonCommute.apk
          ls -lh build/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalloonCommute-APK
          path: build/BalloonCommute.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Balloon Commute v1.0.0"
          draft: false
          prerelease: false
          body: |
            ### 🎈 Balloon Commute - Android APK Ready to Download!

            Téléchargez directement l'APK ci-dessous pour l'installer sur votre appareil Android :
            - **[BalloonCommute.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/BalloonCommute.apk)**
          files: build/BalloonCommute.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
